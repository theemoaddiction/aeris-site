name: Prepare historical Wish Book excerpts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Catalogue/**'
      - 'scripts/extract_wishbook.py'
      - '.github/workflows/extract-wishbook.yml'
permissions:
  contents: write
jobs:
  excerpt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf pillow
      - run: python scripts/extract_wishbook.py
      - name: Commit generated excerpts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add holiday-catalog/wishbook-excerpts/
          if ! git diff --cached --quiet; then
            git commit -m "Generate small Wish Book archival excerpts"
            git push
          fi
