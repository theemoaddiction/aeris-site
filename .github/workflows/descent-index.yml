name: Refresh Descent image index
on:
  push:
    branches: [main]
    paths:
      - 'assets/**'
      - 'scripts/index_descent_assets.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Index all eligible assets
        run: python scripts/index_descent_assets.py
      - name: Commit updated inventory
        run: |
          if ! git diff --quiet -- descent/manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add descent/manifest.json
            git commit -m "Refresh Descent image inventory"
            git push
          fi
