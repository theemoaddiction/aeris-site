<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="b2515cd4-603c-48f1-873d-98b10e5ff5d2"></script>
  <script defer src="../analytics.js"></script>
  <title>CAM 04 // OFFICE EAST</title>
  <meta name="description" content="A fixed view of the office across the street. No activity has been reported.">
  <link rel="canonical" href="https://myliminalreality.com/office-across-the-street/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="The Office Across the Street">
  <meta property="og:description" content="No activity has been reported.">
  <meta property="og:image" content="https://myliminalreality.com/office-across-the-street/office-east.webp">
  <meta property="og:url" content="https://myliminalreality.com/office-across-the-street/">
  <meta property="og:site_name" content="Aeris Mandrake">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="office.css">
</head>
<body>
  <main class="monitor">
    <header class="monitor__header">
      <div>
        <strong>CAM 04</strong>
        <span>OFFICE EAST / EXTERIOR OBSERVATION</span>
      </div>
      <a href="../">← MY LIMINAL REALITY</a>
    </header>

    <section class="feed" aria-label="Live camera view of an empty office at night">
      <img class="feed__still feed__still--first" src="office-east.webp" alt="An empty fluorescent office viewed through a window from across a dark alley">
      <img class="feed__still feed__still--changed" src="office-chair-facing.webp" alt="" aria-hidden="true">
      <div class="feed__light-loss" aria-hidden="true"></div>
      <div class="feed__cup feed__cup--one" aria-hidden="true"></div>
      <div class="feed__cup feed__cup--two" aria-hidden="true"></div>
      <div class="feed__board" aria-hidden="true"><span></span></div>
      <div class="feed__scan" aria-hidden="true"></div>
      <div class="feed__noise" aria-hidden="true"></div>
      <div class="feed__osd feed__osd--top">
        <span class="live"><i></i> LIVE</span>
        <span>CH 04</span>
      </div>
      <div class="feed__osd feed__osd--bottom">
        <time></time>
        <span>REC ●</span>
      </div>
      <p class="feed__message" aria-live="polite"></p>
    </section>

    <footer class="monitor__footer">
      <span>NO ACTIVITY REPORTED</span>
      <button type="button" id="audio-toggle" aria-pressed="false">AUDIO: MUTED</button>
      <span class="signal">SIGNAL 82%</span>
    </footer>
  </main>
  <script src="office.js"></script>
</body>
</html>
